<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NeonTag · 图片标注</title><link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/style.css"><script src="/static/app.js" defer></script>
</head>
<body>
  <header class="header"><a class="brand" href="/"><span class="brand-mark">N</span>NEON<span>TAG</span></a><span class="header-caption">图片标注工作台</span><div class="header-tools"><span class="connection"><i id="connectionDot"></i><span id="connectionText">连接中</span></span><button id="themeToggle" class="icon-button" type="button" aria-label="切换日间主题" title="切换主题">☀</button><button id="settingsToggle" class="secondary" type="button" aria-expanded="true">收起设置</button></div></header>
  <main class="workspace" id="workspace">
    <aside class="settings panel" id="settingsPanel">
      <div class="panel-heading"><h2>新建标注</h2><span class="badge" id="imageCount">0 张</span></div>
      <div class="tabs" role="tablist" aria-label="任务设置"><button class="tab active" id="basicTab" role="tab" aria-selected="true" aria-controls="basicSettings" type="button">基本设置</button><button class="tab" id="rulesTab" role="tab" aria-selected="false" aria-controls="ruleSettings" type="button">标签规则</button><button class="tab" id="imageTab" role="tab" aria-selected="false" aria-controls="imageSettings" type="button">图像处理</button></div>
      <div class="settings-body scroll-area">
        <section id="basicSettings" role="tabpanel" aria-labelledby="basicTab">
          <label for="model">模型</label><select id="model"><option value="qwen3-vl-4b">Qwen3-VL-4B-Instruct</option><option value="qwen3-vl-8b">Qwen3-VL-8B-Instruct</option><option value="local">本地 Qwen VL 模型</option></select>
          <div id="localModelBox" hidden><label for="modelPath">本地模型路径</label><input id="modelPath" placeholder="/hy-tmp/models/Qwen-VL" autocomplete="off"></div>
          <div class="model-status"><span id="modelBadge" class="badge">未下载</span><button id="ensureModel" class="text-button" type="button">检查 / 下载</button></div><div id="modelMessage" class="muted model-message" aria-live="polite">选择模型后检查</div><details id="modelLogsBox" hidden><summary>下载日志</summary><pre id="modelLogs" class="scroll-area"></pre></details>
          <div class="section-divider"></div><label for="input">图片文件夹</label><div class="inline"><input id="input" placeholder="/hy-tmp/images" autocomplete="off"><button id="scan" class="secondary" type="button">读取</button></div>
          <div class="source-summary"><span id="selectionCount">尚未读取</span><button id="openSource" class="text-button" type="button" disabled>查看 / 选择</button></div>
          <label for="output">输出文件夹</label><input id="output" placeholder="/hy-tmp/dataset" autocomplete="off"><div class="grid-two"><div><label for="tagFormat">标签格式</label><select id="tagFormat"><option value="txt">TXT</option><option value="json">JSON</option><option value="csv">CSV</option></select></div><label class="check-label align-bottom"><input id="separate" type="checkbox">图片标签分开</label></div>
        </section>
        <section id="ruleSettings" role="tabpanel" aria-labelledby="rulesTab" hidden><div class="label-row"><label for="prompt">提示词</label><button id="resetPrompt" class="text-button" type="button">恢复默认</button><button id="expandPrompt" class="text-button" type="button">展开 ↗</button></div><textarea id="prompt" rows="10" spellcheck="false"></textarea><label for="minTags">最少标签数量</label><input id="minTags" type="number" value="20" min="1" max="150"><label class="check-label field-gap"><input id="triggerEnabled" type="checkbox">添加触发词</label><input id="trigger" placeholder="例如：my_style" disabled maxlength="200"></section>
        <section id="imageSettings" role="tabpanel" aria-labelledby="imageTab" hidden><label for="longEdge">长边 / px</label><input id="longEdge" type="number" value="1024" min="32" max="8192"><label for="prefix">文件名前缀</label><input id="prefix" value="image" maxlength="100"><label for="imageFormat">图片格式</label><select id="imageFormat"><option value="jpg">JPG</option><option value="png">PNG</option><option value="webp">WEBP</option></select><button id="preprocess" class="secondary full field-gap" type="button">缩放并统一重命名</button><p class="muted">原图自动备份 · 短边等比例</p></section>
      </div>
      <div class="settings-bottom"><details id="testSection"><summary>随机测试 <span id="testBadge" class="muted">未测试</span></summary><div class="test-actions"><label for="sampleCount">数量</label><input id="sampleCount" type="number" value="2" min="1" max="50"><button id="previewTest" class="secondary" type="button">抽取预览</button></div></details><button id="startBulk" class="primary full" type="button">开始全部打标签 ↗</button></div>
    </aside>
    <div class="content" id="content">
      <section class="panel task-panel" id="taskPanel"><div class="panel-heading"><div class="heading-inline"><h1>任务列表</h1><span id="taskCount" class="count">0</span></div><div class="inline"><select id="taskFilter" aria-label="任务筛选"><option value="all">全部任务</option><option value="bulk">批量任务</option><option value="test">测试任务</option></select><button id="refreshJobs" class="icon-button" type="button" aria-label="刷新任务">↻</button></div></div><div id="taskList" class="task-list scroll-area"><div class="empty-state"><span class="empty-icon">▤</span><strong>暂无任务</strong><span>读取图片后开始标注</span></div></div><div class="task-toolbar"><span id="currentTask" class="muted">未选择任务</span><div class="inline"><button id="pauseJob" class="secondary" type="button" disabled>暂停</button><button id="cancelJob" class="secondary" type="button" disabled>取消</button><button id="resumeJob" class="secondary" type="button" disabled>继续 / 重试</button><button id="restoreJob" class="text-button" type="button" disabled>载入设置</button></div></div></section>
      <section class="panel logs-panel" id="logsPanel"><div class="panel-heading"><div class="heading-inline"><h2>实时日志</h2><span class="live-dot"></span><span id="logCount" class="muted">0 条</span></div><div class="inline"><label class="check-label"><input id="followLogs" type="checkbox" checked>跟随</label><button id="expandLogs" class="text-button" type="button" aria-expanded="false">放大 ↗</button><button id="collapseLogs" class="icon-button" type="button" aria-label="收起日志" aria-expanded="true">−</button></div></div><div id="liveLogs" class="log-lines scroll-area" role="log" aria-live="off"><div class="muted">等待任务</div></div></section>
      <section class="panel export-panel"><div class="export-heading"><h2>打包导出</h2><span id="exportJob" class="muted">未选择任务</span></div><div class="archive-row"><input id="archiveName" value="dataset" placeholder="压缩包名称" aria-label="压缩包名称"><select id="archiveFormat" aria-label="压缩格式"><option value="zip">ZIP</option><option value="tar.gz">TAR.GZ</option><option value="rar">RAR</option></select><button id="archive" class="secondary" type="button" disabled>压缩</button></div><div id="archiveList" class="archive-list scroll-area" aria-live="polite"></div></section>
    </div>
  </main>
  <div id="toast" role="status" hidden></div>
  <dialog id="confirmDialog"><form method="dialog"><h2 id="confirmTitle"></h2><p id="confirmBody"></p><div class="dialog-actions"><button value="cancel" class="secondary">返回</button><button value="confirm" class="primary">确认</button></div></form></dialog>
  <dialog id="sourceDialog" class="source-dialog"><div class="panel-heading"><h2 id="sourceTitle">图片选择</h2><div class="inline"><label id="allSelectRow" class="check-label"><input id="selectAll" type="checkbox" checked>全选</label><button id="closeSource" class="secondary" type="button">关闭</button></div></div><div id="gallery" class="gallery scroll-area"></div><div class="dialog-footer"><div class="pager"><button id="previousPage" class="text-button" type="button">上一页</button><span id="pageInfo"></span><button id="nextPage" class="text-button" type="button">下一页</button></div><button id="confirmTest" class="primary" type="button" hidden>确认图片 · 开始测试</button></div></dialog>
  <dialog id="reviewDialog" class="review-dialog"><div class="panel-heading"><h2 id="reviewTitle">图片结果</h2><button id="closeReview" class="secondary" type="button">关闭</button></div><div class="review-body"><div class="review-image"><img id="reviewImage" alt="标注图片"></div><div class="review-tags"><div class="label-row"><label for="reviewTags">标签</label><span id="reviewStatus" class="badge"></span></div><textarea id="reviewTags" spellcheck="false"></textarea><div id="reviewError" class="error-text" hidden></div><div class="review-footer"><span id="reviewHint" class="muted"></span><button id="saveReview" class="primary" type="button" disabled>保存标签</button></div></div></div><div class="pager"><button id="reviewPrevious" class="secondary" type="button">← 上一张</button><span id="reviewPageInfo"></span><button id="reviewNext" class="secondary" type="button">下一张 →</button></div></dialog>
  <dialog id="promptDialog"><div class="panel-heading"><h2>提示词</h2><button id="closePrompt" class="primary" type="button">应用</button></div><textarea id="expandedPrompt" rows="18" aria-label="完整提示词" spellcheck="false"></textarea></dialog>
</body>
</html>
